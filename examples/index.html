<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>three.js examples</title>
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="shortcut icon" href="../files/favicon_white.ico" media="(prefers-color-scheme: dark)"/>
		<link rel="shortcut icon" href="../files/favicon.ico" media="(prefers-color-scheme: light)" />
		<link rel="stylesheet" type="text/css" href="../files/main.css">
	</head>
	<body>

		<div id="panel">

			<div id="header">
				<h1><a href="https://threejs.org">three.js</a></h1>

				<div id="sections">
					<span class="selected">examples</span>
				</div>

				<div id="expandButton"></div>
			</div>

			<div id="panelScrim"></div>

			<div id="contentWrapper">

				<div id="inputWrapper">
					<input placeholder="" type="text" id="filterInput" autocorrect="off" autocapitalize="off" spellcheck="false" />
					<div id="clearSearchButton"></div>
				</div>

				<div id="content">
					<img id="previewsToggler" src="./files/thumbnails.svg" width="20" height="20" />
				</div>
			</div>

		</div>

		<div class="codebar closed left-pane">
			<div class="codefiles">
				<div class="codefiles-tabs"></div>
				<div class="codefiles-actions">
					<div class="codefiles-action" id="codefiles-action-format">
						<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" width="1em" height="1em"><path d="M10.33 1.67h-8c-.45-.02-.43-.67 0-.67h8c.44 0 .46.64 0 .67m-8 2.66c-.45-.02-.43-.66 0-.66H7c.44 0 .45.64 0 .66zM5.67 3c-.46-.02-.44-.66 0-.67h6.66c.44.01.46.65 0 .67zm5.33.67c.44 0 .45.64 0 .66H8.33c-.45-.02-.43-.66 0-.66zm1.33.66c-.45-.02-.43-.66 0-.66H13c.44 0 .45.64 0 .66zm-10 1.34c-.45-.02-.43-.67 0-.67h1.34c.43 0 .45.64 0 .67zm8 0c-.45-.02-.43-.67 0-.67h3.34c.43 0 .45.64 0 .67zM5 5.67C4.55 5.65 4.57 5 5 5h.67c.43 0 .45.64 0 .67zm-2.67 8c-.45-.02-.43-.67 0-.67h1.34c.43 0 .45.64 0 .67zm2.67 0c-.45-.02-.43-.67 0-.67h.67c.43 0 .45.64 0 .67zM10.33 7c-.45-.02-.43-.66 0-.67h3.34c.43.01.45.65 0 .67zm-8 0c-.45-.02-.43-.66 0-.67h3.34c.43.01.45.65 0 .67zm0 5.33c-.45-.02-.43-.66 0-.66h3.34c.43 0 .45.64 0 .66zm0 2.67c-.45-.02-.43-.66 0-.67h3.34c.43.01.45.65 0 .67zm0-6.67c-.45-.02-.43-.66 0-.66H3c.44 0 .45.64 0 .66zm2 0c-.45-.02-.43-.66 0-.66h2c.44 0 .46.64 0 .66zm3.34 0c-.46-.02-.44-.66 0-.66H13c.44 0 .45.64 0 .66zm2.66 1.34c-.45-.02-.43-.67 0-.67h2c.44 0 .46.64 0 .67zm-4 0c-.45-.02-.43-.67 0-.67H9c.44 0 .45.64 0 .67zm-4 0c-.45-.02-.43-.67 0-.67H5c.44 0 .45.64 0 .67zm0 1.33c-.45-.02-.43-.66 0-.67H3c.44.01.45.65 0 .67zm2 0c-.45-.02-.43-.66 0-.67h6c.44.01.46.65 0 .67zm-2-8c-.45-.02-.43-.66 0-.67h2c.44.01.46.65 0 .67z"></path></svg>
					</div>
					<div class="codefiles-action" id="codefiles-action-run">
						<svg xmlns="http://www.w3.org/2000/svg" width="1.25em" height="1.25em" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M4.681 3H2V2h3.5l.5.5V6H5V4a5 5 0 1 0 4.53-.761l.302-.954A6 6 0 1 1 4.681 3" clip-rule="evenodd"></path></svg>
					</div>
					<div class="codefiles-action" id="codefiles-action-close">
						&times;
					</div>
				</div>
			</div>
			<div class="codebox"></div>
		</div>

		<div class="panes-separator"><div class="panes-separator-line"></div></div>

		<iframe class="right-pane" id="viewer" name="viewer" allow="fullscreen; xr-spatial-tracking;"></iframe>

		<link rel="stylesheet" href="./_index/editor/editor.css">
		<div id="button"><img src="../files/ic_code_black_24dp.svg"></div>
		<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/js-untar@2.0.0/build/dist/untar.min.js"></script>

		<!-- https://github.com/microsoft/monaco-editor/blob/main/docs/integrate-amd.md -->
		<script src="https://unpkg.com/monaco-editor@0.52.2/min/vs/loader.js"></script>
		<script src="https://unpkg.com/monacopilot@1.2.7/dist/index.global.js"></script>
		<script src="https://unpkg.com/monaco-tm@0.1.0/dist/index.global.js"></script>

		<style>
			body {
				display: flex !important;
			}
			#panel, #viewer, iframe {
				position: relative !important;
			}
			#viewer{
				padding-left: 0 !important;
			}
		</style>
		<script type="module">
			import { setupCodeEditor } from './_index/editor/setup.mjs';
			const iframe = document.getElementById( 'viewer' );
			const setEditorExample = setupCodeEditor( iframe );
			window.setEditorExample = setEditorExample;

		</script>

		<script type="module">

		const panel = document.getElementById( 'panel' );
		const content = document.getElementById( 'content' );
		const viewer = document.getElementById( 'viewer' );
		const filterInput = document.getElementById( 'filterInput' );
		const clearSearchButton = document.getElementById( 'clearSearchButton' );
		const expandButton = document.getElementById( 'expandButton' );
		const viewSrcButton = document.getElementById( 'button' );
		const panelScrim = document.getElementById( 'panelScrim' );
		const previewsToggler = document.getElementById( 'previewsToggler' );

		const links = {};
		const validRedirects = new Map();
		const fragment = document.createDocumentFragment();

		let selected = null;

		init();

		async function init() {

			viewSrcButton.style.display = 'none';

			const files = await ( await fetch( 'files.json' ) ).json();
			const tags = await ( await fetch( 'tags.json' ) ).json();

			for ( const key in files ) {

				const category = files[ key ];

				const header = document.createElement( 'h2' );
				header.textContent = key;
				header.setAttribute( 'data-category', key );
				fragment.appendChild( header );

				for ( let i = 0; i < category.length; i ++ ) {

					const file = category[ i ];

					const link = createLink( file, tags[ file ] );
					fragment.appendChild( link );

					links[ file ] = link;
					validRedirects.set( file, file + '.html' );

				}

			}

			content.appendChild( fragment );

			if ( window.location.hash !== '' ) {

				const file = window.location.hash.substring( 1 );

				// use a predefined map of redirects to avoid untrusted URL redirection due to user-provided value

				if ( validRedirects.has( file ) === true ) {

					selectFile( file );
					viewer.src = validRedirects.get( file );
					viewer.style.display = 'unset';

				}

			}

			if ( viewer.src === '' ) {

				viewer.srcdoc = document.getElementById( 'PlaceholderHTML' ).innerHTML;
				viewer.style.display = 'unset';

			}

			filterInput.value = extractQuery();

			if ( filterInput.value !== '' ) {

				panel.classList.add( 'searchFocused' );

				updateFilter( files, tags );

			}

			// Events

			filterInput.onfocus = function ( ) {

				panel.classList.add( 'searchFocused' );

			};

			filterInput.onblur = function ( ) {

				if ( filterInput.value === '' ) {

					panel.classList.remove( 'searchFocused' );

				}

			};

			clearSearchButton.onclick = function ( ) {

				filterInput.value = '';
				updateFilter( files, tags );
				filterInput.focus();

			};

			filterInput.addEventListener( 'input', function () {

				updateFilter( files, tags );

			} );


			expandButton.addEventListener( 'click', function ( event ) {

				event.preventDefault();
				panel.classList.toggle( 'open' );

			} );

			panelScrim.onclick = function ( event ) {

				event.preventDefault();
				panel.classList.toggle( 'open' );

			};

			previewsToggler.onclick = function ( event ) {

				event.preventDefault();
				content.classList.toggle( 'minimal' );

			};

			// iOS iframe auto-resize workaround

			if ( /(iPad|iPhone|iPod)/g.test( navigator.userAgent ) ) {

				viewer.style.width = getComputedStyle( viewer ).width;
				viewer.style.height = getComputedStyle( viewer ).height;
				viewer.setAttribute( 'scrolling', 'no' );

			}

		}

		function createLink( file, tags ) {

			const external = Array.isArray( tags ) && tags.includes( 'external' ) ? ' <span class="tag">external</span>' : '';

			const template = `
				<div class="card">
					<a href="${ file }.html" target="viewer">
						<div class="cover">
							<img src="screenshots/${ file }.jpg" loading="lazy" width="400" />
						</div>
						<div class="title">${ getName( file ) }${ external }</div>
					</a>
				</div>
			`;

			const link = createElementFromHTML( template );

			link.querySelector( 'a[target="viewer"]' ).addEventListener( 'click', function ( event ) {

				if ( event.button !== 0 || event.ctrlKey || event.altKey || event.metaKey ) return;

				selectFile( file );

			} );

			return link;

		}

		function selectFile( file ) {

			if ( selected !== null ) links[ selected ].classList.remove( 'selected' );

			links[ file ].classList.add( 'selected' );

			window.location.hash = file;
			viewer.focus();
			viewer.style.display = 'unset';

			panel.classList.remove( 'open' );

			selected = file;

			// Reveal "View source" button and set attributes to this example
			viewSrcButton.style.display = '';
			viewSrcButton.href = 'https://github.com/mrdoob/three.js/blob/master/examples/' + selected + '.html';
			viewSrcButton.title = 'View source code for ' + getName( selected ) + ' on GitHub';

			window.setEditorExample( file + '.html' );

		}

		function escapeRegExp( string ) {

			string = string.replace( /[.*+?^${}()|[\]\\]/g, '\\$&' ); // https://stackoverflow.com/a/6969486/5250847

			return '(?=.*' + string.split( ' ' ).join( ')(?=.*' ) + ')'; // match all words, in any order

		}

		function updateFilter( files, tags ) {

			let v = filterInput.value.trim();
			v = v.replace( /\s+/gi, ' ' ); // replace multiple whitespaces with a single one

			if ( v !== '' ) {

				window.history.replaceState( {}, '', '?q=' + v + window.location.hash );

			} else {

				window.history.replaceState( {}, '', window.location.pathname + window.location.hash );

			}

			const exp = new RegExp( escapeRegExp( v ), 'gi' );

			for ( const key in files ) {

				const section = files[ key ];

				for ( let i = 0; i < section.length; i ++ ) {

					filterExample( section[ i ], exp, tags );

				}

			}

			layoutList( files );

		}

		function filterExample( file, exp, tags ) {

			const link = links[ file ];
			if ( file in tags ) file += ' ' + tags[ file ].join( ' ' );
			const res = file.replace( /_+/g, ' ' ).match( exp );

			if ( res && res.length > 0 ) {

				link.classList.remove( 'hidden' );

			} else {

				link.classList.add( 'hidden' );

			}

		}

		function getName( file ) {

			const name = file.split( '_' );
			name.shift();
			return name.join( ' / ' );

		}

		function layoutList( files ) {

			for ( const key in files ) {

				let collapsed = true;

				const section = files[ key ];

				for ( let i = 0; i < section.length; i ++ ) {

					const file = section[ i ];

					if ( links[ file ].classList.contains( 'hidden' ) === false ) {

						collapsed = false;
						break;

					}

				}

				const element = document.querySelector( 'h2[data-category="' + key + '"]' );

				if ( collapsed ) {

					element.classList.add( 'hidden' );

				} else {

					element.classList.remove( 'hidden' );

				}

			}

		}

		function extractQuery() {

			const search = window.location.search;

			if ( search.indexOf( '?q=' ) !== - 1 ) {

				return decodeURI( search.slice( 3 ) );

			}

			return '';

		}

		function createElementFromHTML( htmlString ) {

			const div = document.createElement( 'div' );
			div.innerHTML = htmlString.trim();
			return div.firstChild;

		}

		</script>
		<template id="PlaceholderHTML">
			<!DOCTYPE html>
				<html lang="en">
					<head>
						<meta charset="utf-8">
						<title>three.js examples</title>
						<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
						<link rel="stylesheet" type="text/css" href="../files/main.css">
						<style>
						html, body {
							height: 100%;
						}
						body {
							height: 100%;
							display: flex;
							align-items: center;
							justify-content: center;
							user-select: none;
						}
						</style>
					</head>
					<body>
						Select an example from the sidebar
					</body>
				</html>
		</template>
	</body>
</html>
